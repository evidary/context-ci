name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-docs:
    name: links, tables, encoding, index coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run documentation checks
        run: python tools/check_docs.py

  check-vendored-contracts:
    name: vendored contracts match VENDORED.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify vendored contract digests
        run: python tools/check_vendor.py

  # Requirement C-09: the tool runs on Linux, macOS and Windows runners. The Go version is the
  # one go.mod names, so the toolchain CI uses cannot drift from the one the module declares.
  go:
    name: gofmt, vet, build, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...

  # The README quickstart, executed: a prompt is edited on a branch and check has to report it and,
  # with the gate turned up, exit 1. The script is the one a contributor runs locally.
  smoke:
    name: the README quickstart gates an edited prompt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the binary
        run: go build -trimpath -o "$RUNNER_TEMP/context-ci" ./cmd/context-ci
      - name: Run the quickstart
        run: bash tools/smoke_quickstart.sh "$RUNNER_TEMP/context-ci"

  # The composite action itself, from this checkout, against the example project. No Go toolchain
  # is set up here on purpose: the action has to get its own binary. It runs twice: an unedited
  # checkout has to pass, and an edited prompt has to fail the step.
  action:
    name: action.yml runs against examples/minimal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: An unedited checkout passes
        uses: ./
        with:
          root: examples/minimal
          base-ref: HEAD
      - name: Edit the example prompt
        shell: bash
        run: echo "Always offer a refund." >> examples/minimal/prompts/support.md
      - name: The edited prompt is reported
        id: edited
        continue-on-error: true
        uses: ./
        with:
          root: examples/minimal
          base-ref: HEAD
      - name: The edit must have failed the gate
        shell: bash
        env:
          OUTCOME: ${{ steps.edited.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "the action reported '$OUTCOME' for an edited prompt; the example gates on warnings, so it has to fail"
            exit 1
          fi
      - name: An acknowledged edit passes
        uses: ./
        with:
          root: examples/minimal
          base-ref: HEAD
          acknowledge: prompt.template_hash
